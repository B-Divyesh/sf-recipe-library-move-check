[package]
name = "recipe-library-move-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Local preflight reports for Mealie and Tandoor recipe-library moves"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-recipe-library-move-check"
keywords = ["recipes", "mealie", "tandoor", "migration", "cli"]
categories = ["command-line-utilities"]
include = [
  "/src/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[[bin]]
name = "recipe-move-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.12"
